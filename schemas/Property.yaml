type: object
description: Property structure.
properties:
  property_id:
    type: string
    readOnly: true
    description: The unique ID of the property.
    example: "size"
  name:
    type: string
    description: Name of the property.
    example: "Size"
  description:
    type: string
    description: User defined description of the property.
    example: "size"
  data_type:
    type: string
    description: |
      Data type of the property value.

      Standard (writable) data types: `string`, `integer`, `boolean`, `float`, `date`, `timestamp`, `enum`, `multiselect`.

      Properties may also have a custom data type. Custom data types fall into two read-only categories:

      - **Dynamic properties** have a driver that computes the value automatically (for example, a timestamp driver that records the current date and time). The value is populated by the system and cannot be set via the API.
      - **System properties** are managed internally by the platform and cannot be set via the API.

      To determine whether a property is writable, check its `data_type` value. If it is one of the standard types listed above, the property accepts values in write requests. If it is a custom data type, the property may be dynamic or system. See the [Properties](https://carecloud.readme.io/reference/getting-started-with-your-api#properties) section for details.
    example: "string"
  items:
    type: array
    maxItems: 1000
    items:
      $ref: '../schemas/_index.yaml#/PropertyItem'
    description: List of possible values. Used for multivalued data types (like enum, multiselect).
  is_required:
    type: boolean
    enum:
      - true
      - false
    description: The settings whether the property is a required parameter of the specific entity.
    example: false
  is_unique:
    type: boolean
    enum:
      - true
      - false
    description: The setting whether the property contains a unique value within the specific entity.
    example: false
  last_change:
    type: string
    readOnly: true
    description: Date and time of the last change. *(YYYY-MM-DD HH:MM:SS)*
    example: "2019-06-20 14:48:09"
  state:
    type: integer
    enum:
      - 0
      - 1
      - 2
    readOnly: true
    description: |
      State of the property
      *Possible values are: 0 - deleted / 1 - active *
    example: 1
required:
  - name
  - data_type
  - is_required
  - is_unique