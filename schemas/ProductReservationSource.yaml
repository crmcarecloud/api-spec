type: object
description: Product reservation source resource.
properties:
  product_reservation_source_id:
    type: string
    readOnly: true
    description: The unique ID of the product reservation source.
    example: "8bed991c68a470e7aaeffbf048"
  name:
    type: string
    description: Name of the product reservation source. The language depends on the `Accept-Language` HTTP request header.
    example: "E-shop"
  last_change:
    type: string
    readOnly: true
    description: "Timestamp of the last change. Format: `YYYY-MM-DD HH:MM:SS`. All times are in the local timezone."
    example: "2020-09-09 12:32:42.143353"
  state:
    type: integer
    enum:
      - 0
      - 1
      - 2
    readOnly: true
    description: |
      State of the product reservation source.
      *Possible values are: 0 - deleted / 1 - active *
    example: 1
