type: object
description: External application structure.
properties:
  external_application_id:
    type: string
    description: The unique ID of the external application.
    example: "8bed991c68a470e7aaeffbf048"
  text_id:
    type: string
    readOnly: true
    description: The unique text identifier of the external application.
    example: "sandbox_app"
  name:
    type: string
    description: The name of the external application.
    example: "Sandbox app"
  last_change:
    type: string
    readOnly: true
    description: "Timestamp of the last change. Format: `YYYY-MM-DD HH:MM:SS`. All times are in the local timezone."
    example: "2021-07-26 09:46:59.005819"
  state:
    type: integer
    enum:
      - 0
      - 1
      - 2
    readOnly: true
    description: |
      State of the external application.
      *Possible values are: 0 - deleted / 1 - active / 2 - non active*
    example: 1
required:
  - external_application_id
  - name