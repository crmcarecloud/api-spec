type: object
readOnly: true
description: |
  Selection criteria that define which customers are included in an audience or segment. The criteria are organized into categories, each targeting a different dimension of customer data.

  **Combination logic:**
  - All specified categories are combined with **AND** logic: a customer must satisfy every active category to be included.
  - All specified fields within a category are combined with **AND** logic: every field condition must be met.
  - Array values within a single field use **OR** logic: a customer matches if their value equals any item in the array.

  The only exception is `segment_combination`, which uses its own explicit set operator (union, intersection, or exclusive union).

  When a category is not present (null or omitted), it imposes no restriction. An audience or segment with no criteria includes all customers.
properties:
  sociodemographic:
    readOnly: true
    description: Sociodemographic criteria (gender, age, birthday, territory, language).
    $ref: './_index.yaml#/SociodemographicCriteria'
  loyalty:
    readOnly: true
    description: Loyalty program criteria (membership level, points).
    $ref: './_index.yaml#/LoyaltyCriteria'
  transaction:
    readOnly: true
    description: Transaction and purchase criteria (amounts, types, stores).
    $ref: './_index.yaml#/TransactionCriteria'
  product:
    readOnly: true
    description: Product criteria (specific products, groups, brands, product lines).
    $ref: './_index.yaml#/ProductCriteria'
  event:
    readOnly: true
    description: Event and activity criteria (event types, event properties).
    $ref: './_index.yaml#/EventCriteria'
  consent:
    readOnly: true
    description: Consent and communication preference criteria.
    $ref: './_index.yaml#/ConsentCriteria'
  segment_combination:
    readOnly: true
    description: Criteria that combine membership of other segments using a set operation (union, intersection, or exclusive union).
    $ref: './_index.yaml#/SegmentCombinationCriteria'
  customer_properties:
    type: array
    readOnly: true
    description: List of dynamic customer property conditions. Each item specifies a property and the values a customer must have to match.
    items:
      $ref: './_index.yaml#/CustomerPropertyCriterion'
  reservation:
    readOnly: true
    description: Reservation criteria (products, states, sources).
    $ref: './_index.yaml#/ReservationCriteria'
