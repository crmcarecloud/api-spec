type: object
description: Partner record.
properties:
  partner_record_id:
    type: string
    readOnly: true
    description: The unique ID of the partner record.
    example: "88bd53f8ac5f3b595d6bc106a4"
  partner_id:
    type: string
    description: The unique ID of the partner. [GET /partners](https://carecloud.readme.io/reference/getpartners)
    example: "86e05affc7a7abefcd513ab400"
  last_change:
    type: string
    readOnly: true
    description: "Timestamp of the last change. Format: `YYYY-MM-DD HH:MM:SS`. All times are in the local timezone."
required:
  - partner_id