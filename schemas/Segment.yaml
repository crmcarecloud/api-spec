type: object
description: A segment is a group of customers defined by selection criteria or by manually adding and removing individual customers. Segments are used for campaign targeting, reward eligibility, and customer analysis.
properties:
  segment_id:
    type: string
    readOnly: true
    description: The unique ID of the segment.
    example: "82de12eb8b138791e678fd11c3"
  name:
    type: string
    description: Name of the segment.
    example: "VIP customers"
  segment_group_id:
    type: string
    readOnly: true
    description: The unique ID of the segment group. [GET /segment-groups](https://carecloud.readme.io/reference/getsegmentgroups)
    example: "8bed991c68a470e7aaeffbf048"
  segment_picture_url:
    type: string
    readOnly: true
    description: URL of the picture assigned to the segment.
  note:
    type: string
    description: Short description of the segment.
    example: "VIP customers note test"
  customer_count:
    type: integer
    readOnly: true
    description: The number of customers currently included in the segment. This value is cached and may not reflect real-time membership changes. On the detail endpoint (`GET /segments/{segment_id}`), this field is always included. On the list endpoint (`GET /segments`), this field is only included when the query parameter `include_customer_count` is set to `true`.
    example: 12450
  last_change:
    type: string
    readOnly: true
    description: "Timestamp of the last change. Format: `YYYY-MM-DD HH:MM:SS`. All times are in the local timezone."
    example: "2021-06-04 13:25:39"
required:
  - name