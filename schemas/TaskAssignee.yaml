type: object
description: Task assignee.
properties:
  task_assignee_id:
    type: string
    readOnly: true
    description: The unique ID of the task assignee.
    example: "81eaeea13b8984a169c490a325"
  user_id:
    type: string
    description: The unique ID of the assigned user. [GET /users](https://carecloud.readme.io/reference/getusers)
    example: "898a6545ed2bfa3f8466d09bc6"
  name:
    type: string
    readOnly: true
    description: Name of the assigned user.
    example: "Arthur Dent"
  last_change:
    type: string
    readOnly: true
    description: "Timestamp of the last change. Format: `YYYY-MM-DD HH:MM:SS`. All times are in the local timezone."
    example: "2021-06-20 16:59:49"
required:
  - user_id