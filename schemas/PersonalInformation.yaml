type: object
description: Personal information of the customer.
properties:
  salutation:
    type: string
    description: |
      Customer's salutation. When the field is not provided in a POST or PUT request, the system generates a salutation automatically. The generated value depends on the available customer data:

      - When a last name and a recognized gender (Male, Female, or Miss, values 1 to 3) are present, the salutation is derived from the name, gender, and communication language.
      - When the last name is missing but a valid gender is present, a default salutation for the gender and language is used.
      - When neither qualifies, a project-configured default salutation for the communication language is used.

      The generated salutation always ends with a trailing comma. On update, the salutation is regenerated in either of these cases:

      - The field is omitted or empty.
      - The gender or last name has changed, and the current salutation matches the one the system previously generated.
    example: "Dear Mr. Smith,"
  gender:
    type: integer
    nullable: true
    enum:
      - 1
      - 2
      - 3
      - 4
      - 5
    description: |
      Gender of the customer. *Possible values: 1 - Male / 2 - Female / 3 - Miss / 4 - Private / 5 - Other.* When omitted or set to null, the system attempts to detect the gender from the customer's name. Values outside the range 1 to 5 are treated as null, which also triggers auto-detection.
    example: 1
  first_name:
    type: string
    description: First name of the customer.
    example: "John"
  last_name:
    type: string
    description: Last name of the customer.
    example: "Smith"
  pre_nominals:
    type: string
    description: Academic degrees, academic titles, and other titles of the customer placed before the name.
    example: "Dr."
  post_nominals:
    type: string
    description: Academic degrees, academic titles, and other titles of the customer placed after the name.
    example: "Ph.D"
  birthdate:
    type: string
    format: date
    description: "Customer's date of birth in ISO-8601 format (`YYYY-MM-DD`)."
    example: "1985-02-12"
  email:
    type: string
    pattern: ^[-a-z0-9!#$%&'*+\\/=?^_`{|}~]+(\.[-a-z0-9!#$%&'*+\\/=?^_`{|}~]+)*@([a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?\.)+[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])$
    description: |
      Email address of the customer.
      If you provide an email address, CareCloud validates its format and the validity of the domain.
      The regular expression used for validation: `^[-a-z0-9!#$%&'*+\\/=?^_`{|}~]+(\\.[-a-z0-9!#$%&'*+\\/=?^_`{|}~]+)*@([a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?\\.)+[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])$`
    example: "happy_customer@crmcarecloud.com"
  phone:
    type: string
    pattern: ^[1-9][0-9]*$
    description: Mobile phone number of the customer starting with the country calling code, digits only, without a plus sign, leading zeros, or spaces (for example 420523828931).
    example: "420523828931"
  language_id:
    type: string
    description: The unique ID of the language by ISO 639-1 code. [GET /languages](https://carecloud.readme.io/reference/getlanguages)
    example: "en"
  store_id:
    type: string
    description: |
      The unique ID of the original customer account store of registration. In a customer update, the value can only be changed, not removed. Omitting `store_id` in a PUT request preserves the existing value. When provided during customer registration and the project is configured for store-based partner assignment, the system derives the partner from the store and creates a single customer-partner relation. [GET /stores](https://carecloud.readme.io/reference/getstores)
    example: "8bed991c68a4"
  photo_url:
    type: string
    readOnly: true
    description: |
      URL of the customer photo. Read-only. If the customer has no photo, this field is not returned. To set a customer photo, use [POST /customers/{customer_id}/actions/upload-photo](https://carecloud.readme.io/reference/postcustomersuploadphoto). Including `photo_url` in a POST or PUT request body returns HTTP 400.
    example: "https://example.com/photos/customer.jpg"
  address:
    $ref: '../schemas/_index.yaml#/Address'
  agreement:
    deprecated: true
    $ref: '../schemas/_index.yaml#/Agreement'
  consents:
      type: array
      items:
        $ref: '../schemas/_index.yaml#/Consents'
      description: |
        The list of all customer consents. The list of consents is available in the [Consents resource](https://carecloud.readme.io/reference/getconsents).
        This parameter replaces the deprecated `agreement` parameter. If both parameters are provided, `consents` takes effect and `agreement` is ignored entirely.
required:
  - language_id