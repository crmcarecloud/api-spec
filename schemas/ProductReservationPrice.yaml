type: object
description: |
  Product reservation price resource.
properties:
  product_reservation_price_id:
    type: string
    readOnly: true
    description: The unique ID of the product reservation price.
    example: "81eaeea13b8984a169c490a325"
  reservable_product_id:
    type: string
    description: The unique ID of the reservable product. This represents the relation between the price and the product. Required if `plu_ids` is not set. [GET /reservable-products](https://carecloud.readme.io/reference/getreservableproducts)
    example: "8ea2591121e636086a4a9c0992"
  plu_ids:
    type: array
    maxItems: 1000
    items:
      $ref: '../schemas/_index.yaml#/PluId'
    description: An array of all available PLU IDs from the particular product lists. The default is the product ID from the global product list, which contains cleaned data with a unique ID for every product across all POS systems. This is an alternative to `reservable_product_id`. Only products that can be reserved are accepted. Required if `reservable_product_id` is not set.
  value:
    type: number
    format: float
    description: Value of a price for store and currency.
    example: 69
  currency_id:
    type: string
    description: The unique ID of the currency. If `total_price` is set, `currency_id` is mandatory. [GET /currencies](https://carecloud.readme.io/reference/getcurrencies)
    example: "8bed991c68a470e7aaeffbf048"
  store_id:
    type: string
    description: The unique ID of the store tied to the product reservation price. Prices of product can vary depending on the store. [GET /stores](https://carecloud.readme.io/reference/getstores)
    example: "82db62087b0f79a6e14e5747e7"
  last_change:
    type: string
    readOnly: true
    description: "Timestamp of the last change. Format: `YYYY-MM-DD HH:MM:SS`. All times are in the local timezone."
    example: "2020-04-20 11:23:35"
  state:
    type: integer
    enum:
      - 0
      - 1
      - 2
    readOnly: true
    description: |
      State of the product reservation.
      *Possible values are: 0 - deleted / 1 - active *
    example: 1
required:
  - value
  - currency_id