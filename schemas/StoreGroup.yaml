type: object
description: Store group resource.
properties:
  store_group_id:
    type: string
    readOnly: true
    description: The unique ID of the store group.
    example: "8bed991c68a470e7aaeffbf048"
  name:
    type: string
    description: Name of the store group.
    example: "Groceries"
  last_change:
    type: string
    readOnly: true
    description: "Timestamp of the last change. Format: `YYYY-MM-DD HH:MM:SS`. All times are in the local timezone."
    example: "2020-08-24 10:14:00"
required:
  - name