type: object
description: Basic information about a relation between customers.
properties:
  customer_relation_id:
    type: string
    readOnly: true
    description: The unique ID of the customer relation.
    example: "81eaeea13b8984a169c490a325"
  related_customer_id:
    type: string
    description: The unique ID of the related customer. [GET /customers](https://carecloud.readme.io/reference/getcustomers)
    example: "8aa68a112c62ad5f84a22a0652"
  short_name:
    type: string
    readOnly: true
    description: Short name of the customer.
    example: "Peter D."
  customer_relation_type_id:
    type: string
    description: The unique ID of the customer relation type. [GET /customer-relation-types](https://carecloud.readme.io/reference/getcustomerrelationtypes)
    example: "8bed991c68a470e7aaeffbf048"
  is_leading:
    type: boolean
    description: 'Indicates whether the related customer is the leader in the relationship. *Example: Parent is a leader, child is a follower*'
    example: false
  valid_from:
    type: string
    readOnly: true
    description: "Timestamp when the customer relation starts. Format: `YYYY-MM-DD HH:MM:SS`. All times are in the local timezone."
    example: "2022-01-09 22:00:00"
  valid_to:
    type: string
    readOnly: true
    description: "Timestamp when the customer relation ends. Format: `YYYY-MM-DD HH:MM:SS`. All times are in the local timezone."
    example: "2022-01-09 22:30:00"
  last_change:
    type: string
    readOnly: true
    description: "Timestamp of the last change. Format: `YYYY-MM-DD HH:MM:SS`. All times are in the local timezone."
    example: "2022-06-23 11:47:22"
  state:
    type: integer
    enum:
      - 0
      - 1
      - 2
    readOnly: true
    description: 'State of the related customer. *Possible values are: 0 - deleted / 1 - active / 2 - non active*'
    example: 1
required:
  - related_customer_id
  - customer_relation_type_id
  - is_leading