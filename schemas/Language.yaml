type: object
description: Language structure.
properties:
  language_id:
    type: string
    readOnly: true
    description: The unique ID of the language as an ISO 639-1 code.
    example: "cs"
  state:
    type: integer
    enum:
      - 0
      - 1
      - 2
    readOnly: true
    description: |
      State of the event type.
      *Possible values are: 0 - deleted / 1 - active / 2 - non active*
    example: 1
  last_change:
    type: string
    readOnly: true
    description: "Timestamp of the last change. Format: `YYYY-MM-DD HH:MM:SS`. All times are in the local timezone."
    example: "2017-03-24 15:29:47"