type: object
readOnly: true
description: |
  Product criteria for audience or segment membership. All specified fields within this category must match (AND logic). Array values within a single field use OR logic (any value in the array matches).
properties:
  product_ids:
    type: array
    readOnly: true
    description: List of product IDs. A customer matches if they have purchased any of the listed products. The list of products is available at [GET /products](https://carecloud.readme.io/reference/getproducts).
    items:
      type: string
    example: ["86e05affc7a7abefcd513ab400"]
  product_group_ids:
    type: array
    readOnly: true
    description: List of product group IDs. A customer matches if they have purchased products from any of the listed groups. The list of product groups is available at [GET /product-groups](https://carecloud.readme.io/reference/getproductgroups).
    items:
      type: string
    example: ["82de12eb8b138791e678fd11c1"]
  brand_ids:
    type: array
    readOnly: true
    description: List of product brand IDs. A customer matches if they have purchased products from any of the listed brands. The list of brands is available at [GET /product-brands](https://carecloud.readme.io/reference/getproductbrands).
    items:
      type: string
    example: ["8bed991c68a470e7aaeffbf048"]
  product_line_ids:
    type: array
    readOnly: true
    description: List of product line IDs. A customer matches if they have purchased products from any of the listed product lines.
    items:
      type: string
    example: ["8fd73167342d0689c4c015320e"]
