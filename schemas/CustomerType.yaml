type: object
description: Customer type structure.
properties:
  type_id:
    type: string
    readOnly: true
    description: The unique ID of the customer type.
    example: "86e05affc7a7abefcd513ab400"
  name:
    type: string
    readOnly: true
    description: Name of the customer type.
    example: "club"
  last_change:
    type: string
    readOnly: true
    description: "Timestamp of the last change. Format: `YYYY-MM-DD HH:MM:SS`. All times are in the local timezone."
    example: "2017-12-01 14:29:41"
