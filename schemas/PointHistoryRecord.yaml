type: object
description: Point history record.
properties:
  customer_id:
    type: string
    readOnly: true
    description: The unique ID of the customer. [GET /customers](https://carecloud.readme.io/reference/getcustomers)
    example: "87af991126405bf8e7dfb36045"
  point_amount:
    type: number
    format: float
    readOnly: true
    description: The number of points used in the point operation record.
    example: 50
  point_operation_type:
    type: string
    readOnly: true
    description: Type of the point operation record.
    example: "Points addition"
  point_operation_note:
    type: string
    readOnly: true
    description: Note of the point operation record.
    example: "Manual rewards points for the product purchase collection"
  point_type_id:
    type: string
    description: The unique ID of the point type. [GET /point-types](https://carecloud.readme.io/reference/getpointtypes)
    example: "81eaeea13b8984a169c490a325"
  partner_id:
    type: string
    description: The unique ID of the partner company. [GET /partners](https://carecloud.readme.io/reference/getpartners)
    example: "86e05affc7a7abefcd513ab400"
  store_id:
    type: string
    readOnly: true
    description: The unique ID of the store in CareCloud. [GET /stores](https://carecloud.readme.io/reference/getstores)
    example: "86e05affc7a7abefcd513ab400"
  point_history_record_time:
    type: string
    readOnly: true
    description: "Timestamp of the point record in the point history. Format: `YYYY-MM-DD HH:MM:SS`. All times are in the local timezone."
    example: "2021-09-16 15:33:11"
  extended_data:
    type: string
    format: json
    readOnly: true
    description: Extended data are related to the point history as details about the purchase, point expiration, and others. Several parameters depend on the type of point operation.
    example: '{"date_of_points_expiration": null, "external_purchase_id": "97YDFFGIDF78T0Q3", "purchase_value": 23.5}'