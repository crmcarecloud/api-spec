post:
  tags:
    - Customers actions
  summary: Set a new customer status
  description: |
    This endpoint sets a new customer status. CareCloud deactivates any other valid status on the account.

    Customer statuses represent the customer's tier or standing within a loyalty program. Only one status can be active at a time. The response returns the ID of the created status record.

    To view current and past status records on a customer account, use [GET /customers/{customer_id}/statuses](https://carecloud.readme.io/reference/getsubcustomerstatus).

    ⚠️ Endpoint is available only in Enterprise API.
  operationId: postCustomersSetStatusRecord
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            status_id:
              type: string
              description: The unique ID of the status.
              example: "86e05affc7a7abefcd513ab400"
            customer_id:
              type: string
              description: The unique ID of the customer.
              example: "89ac83ca207a820c62c79bf03a"
            valid_from:
              type: string
              description: |
                Timestamp of when the status record starts its validity. If not set, the current date and time is applied. The value must not be in the future. A future value is rejected with HTTP 400. Accepts the format `YYYY-MM-DD HH:MM:SS` or ISO-8601 format (`YYYY-MM-DDTHH:MM:SS`). All times must be in the local timezone.
              example: "2021-01-28 00:00:00"
            valid_to:
              type: string
              description: |
                Timestamp of when the status record validity ends. If not set, the validity from the status definition is applied. Accepts the format `YYYY-MM-DD HH:MM:SS` or ISO-8601 format (`YYYY-MM-DDTHH:MM:SS`). All times must be in the local timezone.
              example: "2021-05-28 23:59:59"
          required:
            - status_id
            - customer_id
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            title: PostCustomersSetStatusRecord200Response
            type: object
            properties:
              data:
                type: object
                properties:
                  status_record_id:
                    type: string
                    description: The unique ID of the customer status record.
                    example: "8ea2591121e636086a4a9c0992"
    '400':
      $ref: '../../api.yaml#/components/responses/BadRequest'
    '401':
      $ref: '../../api.yaml#/components/responses/Unauthorized'
    '403':
      $ref: '../../api.yaml#/components/responses/Forbidden'
    '404':
      $ref: '../../api.yaml#/components/responses/NotFound'
    '405':
      $ref: '../../api.yaml#/components/responses/NotAllowed'
    '429':
      $ref: '../../api.yaml#/components/responses/TooManyRequests'
    '500':
      $ref: '../../api.yaml#/components/responses/InternalServerError'
    '503':
      $ref: '../../api.yaml#/components/responses/ServiceUnavailable'