post:
  tags:
    - Customers actions
  summary: Validation of the customer data
  description: |
    Validate customer data following CareCloud validation standards. Supports validation of passwords and referral codes.

    **Validation types**

    - `password` - validates that the value meets the CareCloud password strength requirements. Call this before [POST /customers](https://carecloud.readme.io/reference/postcustomer) to verify the proposed password.
    - `referral_code` - validates that the value is an existing, active referral code for a valid referral campaign. Call this before [POST /customers](https://carecloud.readme.io/reference/postcustomer) to confirm a referral code is valid before attempting registration. This endpoint does not create or generate referral codes; it only validates an existing one.

    This endpoint does not require authentication.

  operationId: postCustomersValidateCustomerData
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            type:
              type: string
              enum:
                - password
                - referral_code
              description: |
                Type of the customer data to validate. Possible values:
                - `password` - validates the value against CareCloud password strength requirements.
                - `referral_code` - validates that the value is an existing, active referral code.
              example: "password"
            value:
              type: string
              description: Value of the customer data to validate. For `password`, provide the proposed password. For `referral_code`, provide the referral code string.
              example: "neGIecAcu#Tawp0b@Kir"
          required:
            - type
            - value
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            title: PostCustomerValidateCustomerData200Response
            type: object
            properties:
              data:
                type: object
                properties:
                  is_valid:
                    type: boolean
                    description: |
                      Result of the CareCloud validation.
                      *Possible results are: false - The parameter does not have a valid value by CareCloud standard / true - The parameter has a valid value by CareCloud standard*
                    example: true
    '400':
      $ref: '../../api.yaml#/components/responses/BadRequest'
    '403':
      $ref: '../../api.yaml#/components/responses/Forbidden'
    '404':
      $ref: '../../api.yaml#/components/responses/NotFound'
    '405':
      $ref: '../../api.yaml#/components/responses/NotAllowed'
    '429':
      $ref: '../../api.yaml#/components/responses/TooManyRequests'
    '500':
      $ref: '../../api.yaml#/components/responses/InternalServerError'
    '503':
      $ref: '../../api.yaml#/components/responses/ServiceUnavailable'