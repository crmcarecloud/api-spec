get:
  tags:
    - Regions
  summary: Get all regions
  description: |
    Get a list of all regions available in the CareCloud platform. Region records represent the first level of geographic subdivision within a country (for example, a state or province). They are used in audience and segment sociodemographic criteria to filter customers by territory.

    Use the `country_id` parameter to retrieve regions within a specific country, or the `region_name` parameter to search by name. The list of countries is available at [GET /countries](https://carecloud.readme.io/reference/getcountries).
  operationId: getRegions
  parameters:
    - $ref: '../../parameters/_index.yaml#/Accept-Language'
    - $ref: '../../parameters/_index.yaml#/count'
    - $ref: '../../parameters/_index.yaml#/offset'
    - $ref: '../../parameters/_index.yaml#/sort_field'
    - $ref: '../../parameters/_index.yaml#/sort_direction'
    - $ref: '../../parameters/_index.yaml#/country_id'
    - $ref: '../../parameters/_index.yaml#/region_name'
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            title: GetRegions200Response
            type: object
            properties:
              data:
                type: object
                properties:
                  regions:
                    type: array
                    maxItems: 1000
                    description: List of the regions.
                    items:
                      $ref: '../../schemas/_index.yaml#/Region'
                  total_items:
                    type: integer
                    description: The number of all found regions.
                    example: 1
    '400':
      $ref: '../../api.yaml#/components/responses/BadRequest'
    '401':
      $ref: '../../api.yaml#/components/responses/Unauthorized'
    '403':
      $ref: '../../api.yaml#/components/responses/Forbidden'
    '404':
      $ref: '../../api.yaml#/components/responses/NotFound'
    '405':
      $ref: '../../api.yaml#/components/responses/NotAllowed'
    '429':
      $ref: '../../api.yaml#/components/responses/TooManyRequests'
    '500':
      $ref: '../../api.yaml#/components/responses/InternalServerError'
    '503':
      $ref: '../../api.yaml#/components/responses/ServiceUnavailable'
