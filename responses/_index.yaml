BadRequest:
  description: |
    Bad input parameter. The response body's `error.error_data.invalid_params[]` array lists the parameters that caused the failure, each carrying a `reason` code. See the `BadRequestErrorBody` schema for the generic reason taxonomy. Operations with domain-specific business rules document additional reasons at the operation level.
  content:
    application/json:
      schema:
        $ref: '../schemas/_index.yaml#/BadRequestErrorBody'
Unauthorized:
  description: The client has invalid credentials or auth token.
  content:
    application/json:
      schema:
        type: object
        properties:
          error:
            allOf:
              - $ref: '../schemas/_index.yaml#/BasicError'
              - type: object
                properties:
                  error_data:
                    type: object
                    description: Data in case of an exception.
Forbidden:
  description: The client does not exist or the client tried to access an unauthorized property or resource.
  content:
    application/json:
      schema:
        type: object
        properties:
          error:
            type: object
            properties:
              type:
                type: string
                example: "interface_not_allowed_exception"
              title:
                type: string
                example: "Enterprise API is not allowed for this resource"
              detail:
                type: string
                example: "Resource name \"tokens\" is not allowed in Enterprise API"
              error_data:
                type: object
                description: Data in case of an exception.
                properties:
                  invalid_resource_name:
                    type: string
                    example: "tokens"
                  interface:
                    type: string
                    example: "Enterprise"
NotFound:
  description: The resource was not found.
  content:
    application/json:
      schema:
        type: object
        properties:
          error:
            allOf:
              - $ref: '../schemas/_index.yaml#/BasicError'
              - type: object
                properties:
                  error_data:
                    type: object
                    description: Data in case of an exception.
                    properties:
                      resource_name:
                        type: string
                        example: "events"
                      resource_id:
                        type: string
                        example: "84b5e55448fbd6c0b22b4d"
NotAllowed:
  description: The resource does not support the specified HTTP method.
  content:
    application/json:
      schema:
        type: object
        properties:
          error:
            allOf:
              - $ref: '../schemas/_index.yaml#/BasicError'
              - type: object
                properties:
                  error_data:
                    type: object
                    description: Data in case of an exception.
                    properties:
                      http_method:
                        type: string
                        example: "DELETE"
TooManyRequests:
  description: Too many requests - more than the resource limit.
InternalServerError:
  description: Server is not working as expected.
  content:
    application/json:
      schema:
        type: object
        properties:
          error:
            $ref: '../schemas/_index.yaml#/BasicError'
ServiceUnavailable:
  description: Temporary state when the service is temporarily unavailable, overloaded or there is a maintenance window.